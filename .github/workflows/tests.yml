name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies
        run: npm ci
      - name: Check engine syntax
        run: node --check localization_engine.js
      - name: Check dictionaries
        run: node scripts/compare_dicts.js
      - name: Run regression tests
        run: npm test
